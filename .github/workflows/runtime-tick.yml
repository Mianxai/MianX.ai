# Production runtime tick — GitHub Actions scheduler (sub-daily).
#
# Preferred automatic path when Vercel Hobby cannot host sub-daily cron.
# Never commit secrets. Founder must configure repository secrets first:
#   INTERNAL_RUNTIME_SECRET  (or CRON_SECRET) — Bearer token for tick auth
#   RUNTIME_TICK_BASE_URL    — production alias, e.g. https://mian-x-ai.vercel.app
#
# After the first successful run, set on the Vercel deployment:
#   RUNTIME_SCHEDULER_PLATFORM=github_actions
#   RUNTIME_SCHEDULER_ACTIVE=1
# Do NOT set ACTIVE until a tick has been verified.
#
# Cadence note: `*/5 * * * *` is the *target*. GitHub Actions schedule delivery
# is approximate and may skip or delay under platform load — especially on
# private repos. Treat Healthy/Delayed/Stale thresholds as grace windows, not
# exact clocks.

name: Runtime tick

on:
  schedule:
    # Target every 5 minutes — GitHub delivery is approximate.
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  # One production tick at a time; never cancel a healthy in-progress run.
  group: mianx-runtime-tick-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tick:
    name: POST /api/internal/runtime/tick
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Invoke bounded runtime tick
        env:
          RUNTIME_TICK_BASE_URL: ${{ secrets.RUNTIME_TICK_BASE_URL }}
          INTERNAL_RUNTIME_SECRET: ${{ secrets.INTERNAL_RUNTIME_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          BASE="${RUNTIME_TICK_BASE_URL:-}"
          if [ -z "${BASE}" ]; then
            echo "RUNTIME_TICK_BASE_URL secret is not configured." >&2
            exit 1
          fi
          # Prefer the production alias; do not invent alternate hosts.
          case "${BASE}" in
            http://*|https://*) ;;
            *)
              echo "RUNTIME_TICK_BASE_URL must be an http(s) URL." >&2
              exit 1
              ;;
          esac
          TOKEN="${INTERNAL_RUNTIME_SECRET:-}"
          if [ -z "${TOKEN}" ]; then
            TOKEN="${CRON_SECRET:-}"
          fi
          if [ -z "${TOKEN}" ]; then
            echo "INTERNAL_RUNTIME_SECRET or CRON_SECRET must be set in GitHub secrets." >&2
            exit 1
          fi

          REQ_ID="gha-$(date -u +%Y%m%dT%H%M%SZ)-$RANDOM"
          URL="${BASE%/}/api/internal/runtime/tick"
          ATTEMPTS=3
          CODE="000"
          attempt=1
          while [ "${attempt}" -le "${ATTEMPTS}" ]; do
            echo "attempt=${attempt}/${ATTEMPTS} request_id=${REQ_ID}"
            CODE=$(curl -sS -o /tmp/mianx-tick.json -w "%{http_code}" \
              -X POST "${URL}" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              -H "x-request-id: ${REQ_ID}-a${attempt}" \
              --connect-timeout 15 \
              --max-time 90 \
              -d '{"max_jobs":5}' || true)
            echo "http_status=${CODE}"
            # Retry transient upstream failures with bounded backoff.
            if [ "${CODE}" = "200" ] || [ "${CODE}" = "204" ]; then
              break
            fi
            if [ "${CODE}" = "401" ] || [ "${CODE}" = "403" ] || [ "${CODE}" = "404" ]; then
              echo "Non-retryable HTTP ${CODE}" >&2
              break
            fi
            if [ "${attempt}" -lt "${ATTEMPTS}" ]; then
              sleep $((attempt * 5))
            fi
            attempt=$((attempt + 1))
          done

          # Sanitised counters for logs + GitHub Job Summary (never print secrets).
          {
            echo "## Runtime tick summary"
            echo ""
            echo "- request_id: \`${REQ_ID}\`"
            echo "- http_status: \`${CODE}\`"
            echo "- attempts: \`${attempt}\`"
            echo "- target: production tick endpoint (host redacted)"
          } >> "${GITHUB_STEP_SUMMARY}"

          if command -v python3 >/dev/null 2>&1; then
            python3 - <<'PY' >> "${GITHUB_STEP_SUMMARY}"
          import json
          print("")
          print("### Tick result")
          try:
            data = json.load(open("/tmp/mianx-tick.json"))
          except Exception as e:
            print(f"- body_parse_error: `{str(e)[:120]}`")
            raise SystemExit(0)
          if not isinstance(data, dict):
            print("- body: non-object")
            raise SystemExit(0)
          err = data.get("error")
          if isinstance(err, dict):
            print(f"- error_code: `{err.get('code')}`")
            print(f"- error_message: `{str(err.get('message') or '')[:160]}`")
          tick = data.get("tick") if isinstance(data.get("tick"), dict) else {}
          for k in ("recovered", "claimed", "succeeded", "failed", "dead_lettered", "cancelled", "duration_ms", "worker"):
            if k in tick:
              print(f"- {k}: `{tick[k]}`")
          print(f"- ok: `{data.get('ok')}`")
          PY
            python3 - <<'PY'
          import json
          try:
            data = json.load(open("/tmp/mianx-tick.json"))
          except Exception as e:
            print("body_parse_error", str(e)[:120])
            raise SystemExit(0)
          err = data.get("error") if isinstance(data, dict) else None
          if err:
            print("error_code", err.get("code"))
            print("error_message", str(err.get("message") or "")[:160])
          tick = data.get("tick") if isinstance(data, dict) else None
          if isinstance(tick, dict):
            for k in ("recovered", "claimed", "succeeded", "failed", "dead_lettered", "cancelled", "duration_ms", "worker"):
              if k in tick:
                print(f"{k}={tick[k]}")
          print("ok", data.get("ok") if isinstance(data, dict) else None)
          PY
          fi

          case "${CODE}" in
            200|204) exit 0 ;;
            *)
              echo "Tick failed with HTTP ${CODE}" >&2
              exit 1
              ;;
          esac
