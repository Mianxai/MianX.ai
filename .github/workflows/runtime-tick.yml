# Production runtime tick — GitHub Actions DIAGNOSTIC FALLBACK (Phase I.9).
#
# Primary Production scheduler is Supabase Cron job `mianx-runtime-tick-5m`
# (pg_cron → pg_net → /api/internal/runtime/tick). See:
#   execution/PHASE-I9-DURABLE-SCHEDULER-CLOSEOUT.md
#
# This workflow MUST NOT run as an independent every-5-minute Production tick
# after Supabase Cron cutover. Schedule trigger is intentionally removed.
# Retain workflow_dispatch for Founder-controlled diagnostics only.
#
# Secrets (Founder-configured; never commit values):
#   INTERNAL_RUNTIME_SECRET  (or CRON_SECRET) — Bearer token for tick auth
#   RUNTIME_TICK_BASE_URL    — production alias, e.g. https://mian-x-ai.vercel.app
#
# Cutover: apply Vault + migration on Production BEFORE relying on this PR's
# removal of the scheduled trigger. Lease protection prevents duplicate claims
# if both fire briefly during cutover.

name: Runtime tick (diagnostic fallback)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why is this diagnostic tick being run?"
        required: false
        default: "Founder diagnostic"

concurrency:
  # One production tick at a time; never cancel a healthy in-progress run.
  group: mianx-runtime-tick-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tick:
    name: POST /api/internal/runtime/tick (diagnostic)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Invoke bounded runtime tick (diagnostic)
        env:
          RUNTIME_TICK_BASE_URL: ${{ secrets.RUNTIME_TICK_BASE_URL }}
          INTERNAL_RUNTIME_SECRET: ${{ secrets.INTERNAL_RUNTIME_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          echo "NOTE: GitHub Actions is diagnostic fallback only. Primary = Supabase Cron."
          BASE="${RUNTIME_TICK_BASE_URL:-}"
          if [ -z "${BASE}" ]; then
            echo "RUNTIME_TICK_BASE_URL secret is not configured." >&2
            exit 1
          fi
          case "${BASE}" in
            http://*|https://*) ;;
            *)
              echo "RUNTIME_TICK_BASE_URL must be an http(s) URL." >&2
              exit 1
              ;;
          esac
          TOKEN="${INTERNAL_RUNTIME_SECRET:-}"
          if [ -z "${TOKEN}" ]; then
            TOKEN="${CRON_SECRET:-}"
          fi
          if [ -z "${TOKEN}" ]; then
            echo "INTERNAL_RUNTIME_SECRET or CRON_SECRET must be set in GitHub secrets." >&2
            exit 1
          fi

          REQ_ID="gha-diag-$(date -u +%Y%m%dT%H%M%SZ)-$RANDOM"
          URL="${BASE%/}/api/internal/runtime/tick"
          ATTEMPTS=3
          CODE="000"
          attempt=1
          while [ "${attempt}" -le "${ATTEMPTS}" ]; do
            echo "attempt=${attempt}/${ATTEMPTS} request_id=${REQ_ID} source=github_actions"
            CODE=$(curl -sS -o /tmp/mianx-tick.json -w "%{http_code}" \
              -X POST "${URL}" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              -H "x-request-id: ${REQ_ID}-a${attempt}" \
              -H "x-mianx-scheduler-source: github_actions" \
              --connect-timeout 15 \
              --max-time 90 \
              -d '{"max_jobs":5,"source":"github_actions"}' || true)
            echo "http_status=${CODE}"
            if [ "${CODE}" = "200" ] || [ "${CODE}" = "204" ]; then
              break
            fi
            if [ "${CODE}" = "401" ] || [ "${CODE}" = "403" ] || [ "${CODE}" = "404" ]; then
              echo "Non-retryable HTTP ${CODE}" >&2
              break
            fi
            if [ "${attempt}" -lt "${ATTEMPTS}" ]; then
              sleep $((attempt * 5))
            fi
            attempt=$((attempt + 1))
          done

          {
            echo "## Runtime tick summary (GitHub diagnostic fallback)"
            echo ""
            echo "- request_id: \`${REQ_ID}\`"
            echo "- http_status: \`${CODE}\`"
            echo "- attempts: \`${attempt}\`"
            echo "- source: \`github_actions\`"
            echo "- primary_scheduler: \`supabase_cron\`"
            echo "- target: production tick endpoint (host redacted)"
          } >> "${GITHUB_STEP_SUMMARY}"

          if command -v python3 >/dev/null 2>&1; then
            python3 - <<'PY' >> "${GITHUB_STEP_SUMMARY}"
          import json
          print("")
          print("### Tick result")
          try:
            data = json.load(open("/tmp/mianx-tick.json"))
          except Exception as e:
            print(f"- body_parse_error: `{str(e)[:120]}`")
            raise SystemExit(0)
          if not isinstance(data, dict):
            print("- body: non-object")
            raise SystemExit(0)
          err = data.get("error")
          if isinstance(err, dict):
            print(f"- error_code: `{err.get('code')}`")
            print(f"- error_message: `{str(err.get('message') or '')[:160]}`")
          tick = data.get("tick") if isinstance(data.get("tick"), dict) else {}
          for k in ("recovered", "claimed", "succeeded", "failed", "dead_lettered", "cancelled", "duration_ms", "worker", "source"):
            if k in tick:
              print(f"- {k}: `{tick[k]}`")
          claimed = int(tick.get("claimed") or 0)
          succeeded = int(tick.get("succeeded") or 0)
          failed = int(tick.get("failed") or 0)
          if claimed == 0 and succeeded == 0 and failed == 0 and data.get("ok"):
            print("- note: `successful no-op (empty queue)`")
          print(f"- ok: `{data.get('ok')}`")
          PY
            python3 - <<'PY'
          import json
          try:
            data = json.load(open("/tmp/mianx-tick.json"))
          except Exception as e:
            print("body_parse_error", str(e)[:120])
            raise SystemExit(0)
          err = data.get("error") if isinstance(data, dict) else None
          if err:
            print("error_code", err.get("code"))
            print("error_message", str(err.get("message") or "")[:160])
          tick = data.get("tick") if isinstance(data, dict) else None
          if isinstance(tick, dict):
            for k in ("recovered", "claimed", "succeeded", "failed", "dead_lettered", "cancelled", "duration_ms", "worker", "source"):
              if k in tick:
                print(f"{k}={tick[k]}")
          print("ok", data.get("ok") if isinstance(data, dict) else None)
          PY
          fi

          case "${CODE}" in
            200|204) exit 0 ;;
            *)
              echo "Tick failed with HTTP ${CODE}" >&2
              exit 1
              ;;
          esac
