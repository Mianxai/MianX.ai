name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve protected-diff base for PR checks
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA}" ]; then
            echo "PR base SHA missing from GitHub context" >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "${BASE_SHA}"
          git rev-parse --verify "${BASE_SHA}^{commit}" >/dev/null
          echo "MIANX_DIFF_BASE=${BASE_SHA}" >> "${GITHUB_ENV}"
          echo "Resolved protected-diff base ${BASE_SHA}"

      - name: Resolve protected-diff base for branch pushes
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            echo "MIANX_DIFF_BASE=origin/main" >> "${GITHUB_ENV}"
          elif git rev-parse --verify main >/dev/null 2>&1; then
            echo "MIANX_DIFF_BASE=main" >> "${GITHUB_ENV}"
          else
            echo "Unable to resolve protected-diff base" >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Browser harness (default)
        run: npm run test:browser-harness

      - name: Build (no Supabase/Anthropic env vars — must not crash)
        run: npm run build

  browser-chrome:
    name: Chrome Browser Harness
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium system deps
        run: npx playwright install-deps chromium

      - name: Build application
        run: npm run build

      - name: Chrome browser harness
        run: npm run test:browser-harness:chrome
        env:
          MIANX_RUN_CHROME_HARNESS: "1"

      - name: Upload harness diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-harness-diagnostics
          path: |
            /tmp/mianx-*
            **/test-results/**
          if-no-files-found: ignore

  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            test-results/**/trace.zip
            test-results/**/*.png
            test-results/**/*.webm
          if-no-files-found: ignore

  live-run-auth-db:
    name: Live-run Auth Migration DB
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: mianx_lra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mianx_lra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install psql client
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client

      - name: Ephemeral migration apply / security / concurrency / rollback / reapply
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mianx_lra_test
          CONCURRENCY_REPS: "5"
          CONCURRENCY_WORKERS: "8"
        run: |
          set -euo pipefail
          SHA=$(shasum -a 256 supabase/migrations/20260803120000_pilot_live_run_authorizations.sql | awk '{print $1}')
          echo "Migration checksum ${SHA}"
          export EXPECTED_MIGRATION_SHA256="${SHA}"
          chmod +x supabase/tests/live-run-auth/*.sh
          bash supabase/tests/live-run-auth/run-ephemeral-validation.sh

  membership-scope-db:
    name: Membership Scope Migration DB
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: mianx_scope_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mianx_scope_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install psql client
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client

      - name: Ephemeral membership scope apply / RLS / Tenant A-B / rollback / reapply
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mianx_scope_test
        run: |
          set -euo pipefail
          SHA=$(shasum -a 256 supabase/migrations/20260803180000_admin_memberships_optional_tenant_scope.sql | awk '{print $1}')
          echo "Migration checksum ${SHA}"
          export EXPECTED_MEMBERSHIP_SCOPE_SHA256="${SHA}"
          chmod +x supabase/tests/membership-scope/*.sh
          bash supabase/tests/membership-scope/run-ephemeral-validation.sh
