<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MianX.ai — Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --accent: #06b6d4;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg-dark: #0a0a0f;
            --bg-card: #111118;
            --bg-card-hover: #1a1a24;
            --bg-sidebar: #0d0d14;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border: rgba(255,255,255,0.06);
            --border-hover: rgba(255,255,255,0.12);
            --gradient-1: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #06b6d4 100%);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-dark); color: var(--text-primary); overflow-x: hidden; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 3px; }

        /* Layout */
        .app { display: flex; min-height: 100vh; }
        .sidebar { width: 260px; background: var(--bg-sidebar); border-right: 1px solid var(--border); padding: 1.5rem; position: fixed; height: 100vh; overflow-y: auto; z-index: 100; }
        .main { flex: 1; margin-left: 260px; padding: 2rem; }

        /* Sidebar */
        .sidebar-logo { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
        .sidebar-logo-icon { width: 36px; height: 36px; background: var(--gradient-1); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1rem; color: white; }
        .sidebar-logo-text { font-family: 'Space Grotesk', sans-serif; font-size: 1.2rem; font-weight: 700; background: var(--gradient-1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .sidebar-nav { list-style: none; }
        .sidebar-nav li { margin-bottom: 0.25rem; }
        .sidebar-nav a { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; border-radius: 10px; color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: all 0.3s ease; cursor: pointer; }
        .sidebar-nav a:hover, .sidebar-nav a.active { background: rgba(99,102,241,0.1); color: var(--primary-light); }
        .sidebar-nav a svg { width: 18px; height: 18px; }
        .sidebar-badge { margin-left: auto; background: var(--danger); color: white; font-size: 0.7rem; padding: 0.15rem 0.5rem; border-radius: 10px; font-weight: 600; }

        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
        .header h1 { font-family: 'Space Grotesk', sans-serif; font-size: 1.8rem; font-weight: 700; }
        .header-actions { display: flex; gap: 1rem; align-items: center; }
        .header-search { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 0.6rem 1rem; color: var(--text-primary); width: 280px; font-size: 0.9rem; outline: none; transition: all 0.3s ease; }
        .header-search:focus { border-color: var(--primary); }
        .header-btn { background: var(--gradient-1); color: white; padding: 0.6rem 1.2rem; border-radius: 10px; border: none; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: all 0.3s ease; }
        .header-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(99,102,241,0.4); }

        /* Stats Cards */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5rem; margin-bottom: 2rem; }
        .stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; transition: all 0.3s ease; }
        .stat-card:hover { border-color: var(--border-hover); transform: translateY(-2px); }
        .stat-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .stat-card-label { color: var(--text-muted); font-size: 0.85rem; }
        .stat-card-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
        .stat-card-value { font-family: 'Space Grotesk', sans-serif; font-size: 2rem; font-weight: 700; margin-bottom: 0.25rem; }
        .stat-card-change { font-size: 0.8rem; display: flex; align-items: center; gap: 0.25rem; }
        .stat-card-change.up { color: var(--success); }
        .stat-card-change.down { color: var(--danger); }

        /* Filters */
        .filters { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .filter-btn { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 0.5rem 1rem; color: var(--text-secondary); font-size: 0.85rem; cursor: pointer; transition: all 0.3s ease; }
        .filter-btn:hover, .filter-btn.active { background: rgba(99,102,241,0.1); border-color: var(--primary); color: var(--primary-light); }

        /* Table */
        .table-container { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
        .table-header { display: grid; grid-template-columns: 60px 1.5fr 1.5fr 1fr 1.5fr 100px 120px; padding: 1rem 1.5rem; background: rgba(255,255,255,0.02); border-bottom: 1px solid var(--border); font-size: 0.8rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .table-row { display: grid; grid-template-columns: 60px 1.5fr 1.5fr 1fr 1.5fr 100px 120px; padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); align-items: center; transition: all 0.3s ease; cursor: pointer; }
        .table-row:hover { background: rgba(99,102,241,0.03); }
        .table-row:last-child { border-bottom: none; }
        .table-cell { font-size: 0.9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .table-cell.name { font-weight: 600; color: var(--text-primary); }
        .table-cell.email { color: var(--text-secondary); font-size: 0.85rem; }
        .status-badge { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.3rem 0.7rem; border-radius: 6px; font-size: 0.75rem; font-weight: 600; }
        .status-new { background: rgba(99,102,241,0.15); color: var(--primary-light); }
        .status-contacted { background: rgba(245,158,11,0.15); color: var(--warning); }
        .status-converted { background: rgba(34,197,94,0.15); color: var(--success); }
        .status-closed { background: rgba(239,68,68,0.15); color: var(--danger); }
        .actions { display: flex; gap: 0.5rem; }
        .action-btn { width: 32px; height: 32px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); cursor: pointer; transition: all 0.3s ease; }
        .action-btn:hover { background: var(--primary); border-color: var(--primary); color: white; }

        /* Detail Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; padding: 2rem; }
        .modal-overlay.active { display: flex; }
        .modal { background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; }
        .modal-header { padding: 1.5rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .modal-header h3 { font-family: 'Space Grotesk', sans-serif; font-size: 1.3rem; }
        .modal-close { background: none; border: none; color: var(--text-secondary); cursor: pointer; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 8px; transition: all 0.3s ease; }
        .modal-close:hover { background: rgba(255,255,255,0.05); color: var(--text-primary); }
        .modal-body { padding: 1.5rem; }
        .detail-row { display: flex; justify-content: space-between; padding: 0.75rem 0; border-bottom: 1px solid var(--border); }
        .detail-row:last-child { border-bottom: none; }
        .detail-label { color: var(--text-muted); font-size: 0.85rem; }
        .detail-value { color: var(--text-primary); font-weight: 500; font-size: 0.9rem; text-align: right; }
        .detail-message { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 10px; padding: 1rem; margin-top: 1rem; color: var(--text-secondary); font-size: 0.9rem; line-height: 1.6; }
        .modal-footer { padding: 1rem 1.5rem; border-top: 1px solid var(--border); display: flex; gap: 0.75rem; justify-content: flex-end; }
        .modal-btn { padding: 0.6rem 1.2rem; border-radius: 8px; border: none; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: all 0.3s ease; }
        .modal-btn-primary { background: var(--gradient-1); color: white; }
        .modal-btn-secondary { background: rgba(255,255,255,0.05); color: var(--text-secondary); border: 1px solid var(--border); }
        .modal-btn:hover { transform: translateY(-2px); }

        /* Empty State */
        .empty-state { text-align: center; padding: 4rem 2rem; }
        .empty-state-icon { font-size: 3rem; margin-bottom: 1rem; }
        .empty-state h3 { font-family: 'Space Grotesk', sans-serif; font-size: 1.3rem; margin-bottom: 0.5rem; }
        .empty-state p { color: var(--text-muted); font-size: 0.9rem; }

        /* Responsive */
        @media (max-width: 1024px) {
            .sidebar { width: 200px; }
            .main { margin-left: 200px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main { margin-left: 0; }
            .stats-grid { grid-template-columns: 1fr; }
            .table-header, .table-row { grid-template-columns: 1fr; gap: 0.5rem; }
            .table-header { display: none; }
            .table-row { padding: 1rem; border-radius: 10px; margin-bottom: 0.5rem; border: 1px solid var(--border); }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <div class="sidebar-logo-icon">M</div>
                <span class="sidebar-logo-text">MianX.ai</span>
            </div>
            <ul class="sidebar-nav">
                <li><a class="active" data-page="dashboard">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>

                </a></li>
                <li><a data-page="submissions">

                    Analytics
                </a></li>
                <li><a data-page="settings">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                    Settings
                </a></li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main">
            <div class="header">
                <h1>Dashboard</h1>
                <div class="header-actions">
                    <input type="text" class="header-search" id="searchInput" placeholder="Search submissions...">
                    <button class="header-btn" id="exportBtn">Export CSV</button>
                </div>
            </div>

            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-card-header">
                        <span class="stat-card-label">Total Submissions</span>
                        <div class="stat-card-icon" style="background: rgba(99,102,241,0.15);">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                        </div>
                    </div>
                    <div class="stat-card-value" id="totalCount">0</div>
                    <div class="stat-card-change up">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
                        All time
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-header">
                        <span class="stat-card-label">New Leads</span>
                        <div class="stat-card-icon" style="background: rgba(34,197,94,0.15);">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
                        </div>
                    </div>
                    <div class="stat-card-value" id="newLeadsCount" style="color: #22c55e;">0</div>
                    <div class="stat-card-change up">Awaiting response</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-header">
                        <span class="stat-card-label">Contacted</span>
                        <div class="stat-card-icon" style="background: rgba(245,158,11,0.15);">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                        </div>
                    </div>
                    <div class="stat-card-value" id="contactedCount" style="color: #f59e0b;">0</div>
                    <div class="stat-card-change">In progress</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-header">
                        <span class="stat-card-label">Converted</span>
                        <div class="stat-card-icon" style="background: rgba(6,182,212,0.15);">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                        </div>
                    </div>
                    <div class="stat-card-value" id="convertedCount" style="color: #06b6d4;">0</div>
                    <div class="stat-card-change up">Closed deals</div>
                </div>
            </div>

            <!-- Filters -->
            <div class="filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="new">New</button>
                <button class="filter-btn" data-filter="contacted">Contacted</button>
                <button class="filter-btn" data-filter="converted">Converted</button>
                <button class="filter-btn" data-filter="closed">Closed</button>
            </div>

            <!-- Table -->
            <div class="table-container">
                <div class="table-header">
                    <div>ID</div>
                    <div>Name</div>
                    <div>Email</div>
                    <div>Industry</div>
                    <div>Date</div>
                    <div>Status</div>
                    <div>Actions</div>
                </div>
                <div id="tableBody"></div>
            </div>
        </main>
    </div>

    <!-- Detail Modal -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Submission Details</h3>
                <button class="modal-close" id="modalClose">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer">
                <button class="modal-btn modal-btn-secondary" id="modalDelete">Delete</button>
                <button class="modal-btn modal-btn-primary" id="modalStatus">Update Status</button>
            </div>
        </div>
    </div>

    <script>
        // ===== DATA MANAGEMENT =====
        let submissions = JSON.parse(localStorage.getItem('mianx_submissions') || '[]');
        let currentFilter = 'all';
        let currentSubmission = null;

        // Demo data if empty
        if (submissions.length === 0) {
            submissions = [
                { id: 1721520000000, name: 'Ahmed Khan', email: 'ahmed@example.com', company: 'Khan Farms', phone: '+92 300 1234567', industry: 'poultry', message: 'Looking for a poultry management system for our farm in Multan. Need live rates and inventory tracking.', date: '2026-07-20T10:30:00Z', status: 'new' },
                { id: 1721433600000, name: 'Sara Ali', email: 'sara@restaurant.pk', company: 'Spice Kitchen', phone: '+92 321 9876543', industry: 'restaurant', message: 'Need a complete POS and online ordering system for our restaurant chain.', date: '2026-07-19T14:15:00Z', status: 'contacted' },
                { id: 1721347200000, name: 'Dr. Farooq', email: 'dr.farooq@hospital.com', company: 'City Hospital', phone: '+92 333 4567890', industry: 'hospital', message: 'Interested in patient management and EMR system for our hospital.', date: '2026-07-18T09:00:00Z', status: 'new' },
                { id: 1721260800000, name: 'Bilal Hassan', email: 'bilal@school.edu', company: 'Bright Future School', phone: '+92 312 5556666', industry: 'school', message: 'Looking for student management and attendance system.', date: '2026-07-17T16:45:00Z', status: 'converted' }
            ];
            localStorage.setItem('mianx_submissions', JSON.stringify(submissions));
        }

        // ===== STATS =====
        function updateStats() {
            document.getElementById('totalCount').textContent = submissions.length;
            document.getElementById('newCount').textContent = submissions.filter(s => s.status === 'new').length;
            document.getElementById('newLeadsCount').textContent = submissions.filter(s => s.status === 'new').length;
            document.getElementById('contactedCount').textContent = submissions.filter(s => s.status === 'contacted').length;
            document.getElementById('convertedCount').textContent = submissions.filter(s => s.status === 'converted').length;
        }

        // ===== RENDER TABLE =====
        function renderTable() {
            const tbody = document.getElementById('tableBody');
            let filtered = submissions;
            if (currentFilter !== 'all') filtered = submissions.filter(s => s.status === currentFilter);

            const search = document.getElementById('searchInput').value.toLowerCase();
            if (search) {
                filtered = filtered.filter(s =>
                    s.name.toLowerCase().includes(search) ||
                    s.email.toLowerCase().includes(search) ||
                    s.industry.toLowerCase().includes(search)
                );
            }

            if (filtered.length === 0) {
                tbody.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">&#128196;</div>
                        <h3>No submissions found</h3>
                        <p>${currentFilter === 'all' ? 'Waiting for new leads...' : 'No submissions with this status.'}</p>
                    </div>`;
                return;
            }

            tbody.innerHTML = filtered.map(s => `
                <div class="table-row" data-id="${s.id}">
                    <div class="table-cell">#${s.id.toString().slice(-6)}</div>
                    <div class="table-cell name">${s.name}</div>
                    <div class="table-cell email">${s.email}</div>
                    <div class="table-cell">${s.industry.charAt(0).toUpperCase() + s.industry.slice(1)}</div>
                    <div class="table-cell">${new Date(s.date).toLocaleDateString()}</div>
                    <div class="table-cell">
                        <span class="status-badge status-${s.status}">
                            <span style="width:6px;height:6px;background:currentColor;border-radius:50%;display:inline-block;"></span>
                            ${s.status.charAt(0).toUpperCase() + s.status.slice(1)}
                        </span>
                    </div>
                    <div class="table-cell actions">
                        <button class="action-btn" onclick="viewDetail(${s.id})" title="View">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                        <button class="action-btn" onclick="deleteSubmission(${s.id})" title="Delete">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // ===== VIEW DETAIL =====
        function viewDetail(id) {
            currentSubmission = submissions.find(s => s.id === id);
            if (!currentSubmission) return;

            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = `
                <div class="detail-row"><span class="detail-label">Name</span><span class="detail-value">${currentSubmission.name}</span></div>
                <div class="detail-row"><span class="detail-label">Email</span><span class="detail-value">${currentSubmission.email}</span></div>
                <div class="detail-row"><span class="detail-label">Company</span><span class="detail-value">${currentSubmission.company || '-'}</span></div>
                <div class="detail-row"><span class="detail-label">Phone</span><span class="detail-value">${currentSubmission.phone || '-'}</span></div>
                <div class="detail-row"><span class="detail-label">Industry</span><span class="detail-value">${currentSubmission.industry.charAt(0).toUpperCase() + currentSubmission.industry.slice(1)}</span></div>
                <div class="detail-row"><span class="detail-label">Date</span><span class="detail-value">${new Date(currentSubmission.date).toLocaleString()}</span></div>
                <div class="detail-row"><span class="detail-label">Status</span><span class="detail-value"><span class="status-badge status-${currentSubmission.status}">${currentSubmission.status.charAt(0).toUpperCase() + currentSubmission.status.slice(1)}</span></span></div>
                <div style="margin-top: 1rem;"><span class="detail-label">Message</span></div>
                <div class="detail-message">${currentSubmission.message}</div>
            `;
            document.getElementById('detailModal').classList.add('active');
        }

        // ===== UPDATE STATUS =====
        document.getElementById('modalStatus').addEventListener('click', () => {
            if (!currentSubmission) return;
            const statuses = ['new', 'contacted', 'converted', 'closed'];
            const currentIdx = statuses.indexOf(currentSubmission.status);
            currentSubmission.status = statuses[(currentIdx + 1) % statuses.length];
            localStorage.setItem('mianx_submissions', JSON.stringify(submissions));
            updateStats();
            renderTable();
            viewDetail(currentSubmission.id);
        });

        // ===== DELETE =====
        function deleteSubmission(id) {
            if (!confirm('Are you sure you want to delete this submission?')) return;
            submissions = submissions.filter(s => s.id !== id);
            localStorage.setItem('mianx_submissions', JSON.stringify(submissions));
            updateStats();
            renderTable();
            document.getElementById('detailModal').classList.remove('active');
        }
        document.getElementById('modalDelete').addEventListener('click', () => {
            if (currentSubmission) deleteSubmission(currentSubmission.id);
        });

        // ===== MODAL CLOSE =====
        document.getElementById('modalClose').addEventListener('click', () => {
            document.getElementById('detailModal').classList.remove('active');
        });
        document.getElementById('detailModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('detailModal')) {
                document.getElementById('detailModal').classList.remove('active');
            }
        });

        // ===== FILTERS =====
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderTable();
            });
        });

        // ===== SEARCH =====
        document.getElementById('searchInput').addEventListener('input', renderTable);

        // ===== EXPORT CSV =====
        document.getElementById('exportBtn').addEventListener('click', () => {
            const csv = [
                ['ID', 'Name', 'Email', 'Company', 'Phone', 'Industry', 'Message', 'Date', 'Status'],
                ...submissions.map(s => [s.id, s.name, s.email, s.company, s.phone, s.industry, s.message, s.date, s.status])
            ].map(row => row.map(cell => `"${(cell || '').toString().replace(/"/g, '""')}"`).join(',')).join('\n');

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `mianx_submissions_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        });

        // ===== SIDEBAR NAV =====
        document.querySelectorAll('.sidebar-nav a').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                document.querySelectorAll('.sidebar-nav a').forEach(l => l.classList.remove('active'));
                link.classList.add('active');
            });
        });

        // ===== INIT =====
        updateStats();
        renderTable();

        // Auto-refresh every 10 seconds
        setInterval(() => {
            const newData = JSON.parse(localStorage.getItem('mianx_submissions') || '[]');
            if (newData.length !== submissions.length) {
                submissions = newData;
                updateStats();
                renderTable();
            }
        }, 10000);
    </script>
</body>
</html>
